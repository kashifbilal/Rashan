name: rashan_app
description: "Household survey and rashan (ration) distribution app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0     # on-device SQLite database (works fully offline in the field)
  path: ^1.8.3        # helper for building the database file path

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
